name: Release Agent

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build Agent (Linux)
        run: cargo build --release --bin kalpixk-agent --target x86_64-unknown-linux-gnu
      - name: Prepare Artifact
        run: cp target/x86_64-unknown-linux-gnu/release/kalpixk-agent kalpixk-agent-linux
      - uses: actions/upload-artifact@v4
        with:
          name: kalpixk-agent-linux
          path: kalpixk-agent-linux

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@v2
      - name: Build Agent (Windows)
        run: cargo build --release --bin kalpixk-agent --target x86_64-pc-windows-gnu
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      - name: Prepare Artifact
        run: cp target/x86_64-pc-windows-gnu/release/kalpixk-agent.exe kalpixk-agent-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: kalpixk-agent-windows
          path: kalpixk-agent-windows.exe

  create-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kalpixk-agent-linux
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: kalpixk-agent-windows
          path: .
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            kalpixk-agent-linux
            kalpixk-agent-windows.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
