[package]
name = "kalpixk-agent"
version = "9.0.0"
edition = "2021"
authors = ["Julián Juárez <julianjuarezmx01@gmail.com>"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
notify = "6.0"
clap = { version = "4.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
sysinfo = "0.29"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
toml = "0.8"
kalpixk-core = { path = "../kalpixk-core" }
