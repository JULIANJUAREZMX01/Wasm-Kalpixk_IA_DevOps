[package]
name = "kalpixk-node"
version = "5.0.0-atlatl"
edition = "2021"
authors = ["ATLATL-ORDNANCE"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
reqwest = { version = "0.11", features = ["json", "blocking"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
kalpixk-core = { path = "../kalpixk-core" }
