<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAC_OS | KALPIXK ATLATL-ORDNANCE v5.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red-amd: #E31837;
            --black-bg: #050505;
            --card-bg: #0f0f0f;
            --green-cyber: #00ff41;
            --cyan-data: #00e5ff;
            --orange-warn: #ff9d00;
        }
        body {
            background-color: var(--black-bg);
            color: #e4e4e7;
            font-family: 'Fira Code', monospace;
            background-image:
                linear-gradient(rgba(227, 24, 55, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(227, 24, 55, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
        }
        .sac-header {
            border-bottom: 2px solid var(--red-amd);
            background: rgba(15, 15, 15, 0.95);
        }
        .cyber-border {
            border: 1px solid #333;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .cyber-border:hover {
            border-color: var(--red-amd);
            box-shadow: 0 0 15px rgba(227, 24, 55, 0.3);
        }
        .scanline {
            width: 100%;
            height: 4px;
            background: rgba(227, 24, 55, 0.1);
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            animation: scan 4s linear infinite;
            z-index: 1000;
        }
        @keyframes scan {
            0% { top: -100px; }
            100% { top: 100%; }
        }
        .alert-critical { border-left: 4px solid var(--red-amd); background: rgba(227, 24, 55, 0.1); }
        .glitch { animation: glitch 0.2s linear infinite; }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        .phase-black-btn {
            background: linear-gradient(45deg, #000 0%, #E31837 100%);
            border: 1px solid #fff;
            text-shadow: 0 0 5px #fff;
        }
        .phase-black-btn:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 20px var(--red-amd);
        }
    </style>
</head>
<body class="p-4">
    <div class="scanline"></div>

    <!-- SAC_OS Top Command Bar -->
    <div class="max-w-7xl mx-auto sac-header p-4 mb-6 flex justify-between items-center cyber-border rounded-t-lg">
        <div class="flex items-center gap-6">
            <div class="text-red-600 font-bold text-3xl italic tracking-tighter">SAC_OS</div>
            <div class="h-10 w-px bg-zinc-800"></div>
            <div>
                <h1 class="text-xl font-bold uppercase tracking-widest text-zinc-300">ATLATL-ORDNANCE <span class="text-red-500">v5.0</span></h1>
                <div class="flex gap-4 text-[10px] font-bold">
                    <span class="text-red-500 animate-pulse">● ESTATUS: COMBATE</span>
                    <span class="text-zinc-500">SECTOR: CEDIS CANCÚN 427</span>
                    <span id="ws-status" class="text-green-500">○ MESH_CONNECTED</span>
                </div>
            </div>
        </div>
        <div class="flex gap-8 text-right">
            <div>
                <div class="text-[9px] text-zinc-500 uppercase">THROUGHPUT</div>
                <div id="stat-throughput" class="text-xl font-bold text-red-500">4.28M <span class="text-[10px]">ev/s</span></div>
            </div>
            <div class="hidden md:block">
                <div class="text-[9px] text-zinc-500 uppercase">ENTROPY_H</div>
                <div id="stat-entropy" class="text-xl font-bold text-cyan-400">0.000</div>
            </div>
            <button onclick="triggerPhaseBlack()" class="phase-black-btn px-6 py-2 text-xs font-bold text-white uppercase rounded">EXECUTAR: PHASE BLACK</button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-4">

        <!-- Left: Tactical Control -->
        <div class="lg:col-span-4 space-y-4">
            <div class="bg-[#0f0f0f] p-4 cyber-border rounded-lg">
                <div class="text-[10px] font-bold text-red-600 mb-2 uppercase tracking-widest flex items-center gap-2">
                    <span class="w-2 h-2 bg-red-600 rounded-full"></span> AGRESOR SCANNER
                </div>
                <textarea id="log-input" placeholder="INGRESE LOG PARA ANÁLISIS FORENSE..."
                    class="w-full h-32 bg-black border border-zinc-800 rounded p-3 text-xs font-mono focus:border-red-600 outline-none"></textarea>
                <button onclick="analyzeManual()" class="w-full mt-2 py-3 bg-zinc-900 border border-red-900 text-red-500 text-xs font-bold hover:bg-red-950 transition-all">ANALIZAR VECTOR</button>
            </div>

            <div class="bg-[#0f0f0f] p-4 cyber-border rounded-lg">
                <div class="text-[10px] font-bold text-zinc-500 mb-4 uppercase">ORDNANCE COMMANDS</div>
                <div class="grid grid-cols-1 gap-2">
                    <button onclick="injectAttack('brute_force')" class="p-2 text-[10px] font-bold bg-black border border-zinc-800 text-zinc-400 hover:border-red-600 hover:text-red-600">FORCE: SSH_BRUTE</button>
                    <button onclick="injectAttack('db2_drop')" class="p-2 text-[10px] font-bold bg-black border border-zinc-800 text-zinc-400 hover:border-red-600 hover:text-red-600">FORCE: DB2_DESTRUCT</button>
                    <button onclick="injectAttack('ransomware')" class="p-2 text-[10px] font-bold bg-black border border-zinc-800 text-zinc-400 hover:border-red-600 hover:text-red-600">FORCE: RANSOM_T1486</button>
                </div>
            </div>
        </div>

        <!-- Right: Telemetry Feed -->
        <div class="lg:col-span-8 space-y-4">
            <div class="bg-[#0f0f0f] p-4 cyber-border rounded-lg h-[500px] flex flex-col">
                <div class="flex justify-between items-center mb-4 border-b border-zinc-800 pb-2">
                    <div class="text-[10px] font-bold text-red-600 uppercase italic">ATLATL: DETECCIONES EN VIVO</div>
                    <div class="flex gap-6 text-[10px] font-mono text-zinc-500">
                        <span>EVENTS: <span id="event-count">0</span></span>
                        <span class="text-red-500 font-bold">KILLS: <span id="critical-count">0</span></span>
                    </div>
                </div>
                <div id="alert-feed" class="flex-grow overflow-y-auto font-mono text-[9px] space-y-1 pr-2">
                    <div class="text-zinc-700 italic">Esperando telemetría de guerra...</div>
                </div>
            </div>
        </div>

        <!-- Bottom: Entropy Strike Visualization -->
        <div class="lg:col-span-12 bg-[#0f0f0f] p-4 cyber-border rounded-lg">
            <div class="flex justify-between items-center mb-2">
                <div class="text-[10px] font-bold text-cyan-500 uppercase italic">SHANNON ENTROPY STRIKE SENSOR (v5.0-METAL)</div>
            </div>
            <canvas id="entropy-canvas" height="80" style="width:100%;"></canvas>
        </div>
    </div>

    <script>
        let stats = { events: 0, critical: 0 };
        const entropyCanvas = document.getElementById('entropy-canvas');
        const ctx = entropyCanvas.getContext('2d');
        const ENTROPY_HISTORY = 150;
        let entropyData = Array(ENTROPY_HISTORY).fill(0.3);
        let attackMode = false;

        function addLog(data) {
            const feed = document.getElementById('alert-feed');
            const row = document.createElement('div');
            row.className = `p-2 ${data.type === 'critical' ? 'alert-critical' : 'border-l-2 border-zinc-800'} bg-black/40 mb-1 flex justify-between items-center`;

            const time = new Date().toLocaleTimeString();
            row.innerHTML = `
                <div class="flex flex-col">
                    <div class="flex gap-2 items-center">
                        <span class="text-zinc-600">[${time}]</span>
                        <span class="${data.type === 'critical' ? 'text-red-500 font-bold' : 'text-zinc-400'}">${data.msg}</span>
                    </div>
                    <div class="text-zinc-700 truncate max-w-xl">${data.raw}</div>
                </div>
                <div class="text-right">
                    <div class="text-[8px] text-zinc-600">ANOMALY_SCORE</div>
                    <div class="font-bold ${data.score > 0.8 ? 'text-red-500 glitch' : 'text-zinc-400'}">${data.score.toFixed(5)}</div>
                </div>
            `;
            feed.prepend(row);
            if(feed.childNodes.length > 100) feed.removeChild(feed.lastChild);

            stats.events++;
            if(data.type === 'critical') stats.critical++;
            updateUI();
        }

        function updateUI() {
            document.getElementById('event-count').textContent = stats.events;
            document.getElementById('critical-count').textContent = stats.critical;
        }

        function triggerPhaseBlack() {
            const target = "185.220.101.35";
            alert("⚠️ ALERTA: INICIANDO PHASE BLACK CONTRA INFRAESTRUCTURA ENEMIGA (" + target + ")");
            attackMode = true;
            addLog({
                type: 'critical',
                msg: "🏹 EXECUTING PHASE BLACK: SYSTEMIC COLLAPSE INITIATED",
                raw: "Target: " + target + " | Measures: [ZipBomb, PointerPoison, C2Shred]",
                score: 1.00000
            });
            setTimeout(() => { attackMode = false; }, 8000);
        }

        function injectAttack(type) {
            attackMode = true;
            let log = "";
            let msg = "";
            if(type === 'brute_force') {
                log = "Failed password for root from 185.220.101.35 port 51222 ssh2";
                msg = "ALERT: SSH BRUTE FORCE DETECTED (T1110)";
            } else if(type === 'db2_drop') {
                log = "OPERATION=DDL STATEMENT=DROP TABLE NOMINAS AUTHID=DBA_ADMIN";
                msg = "CRITICAL: DATA DESTRUCTION ATTEMPT (T1485)";
            } else if(type === 'ransomware') {
                log = "vssadmin.exe delete shadows /all /quiet";
                msg = "CRITICAL: RANSOMWARE ACTIVITY (T1486)";
            }
            addLog({ type: 'critical', msg, raw: log, score: 0.95 + Math.random() * 0.04 });
            setTimeout(() => { attackMode = false; }, 5000);
        }

        function analyzeManual() {
            const input = document.getElementById('log-input').value;
            if(!input) return;
            addLog({ type: 'info', msg: "MANUAL SCAN INITIATED", raw: input, score: Math.random() * 0.3 });
            document.getElementById('log-input').value = "";
        }

        function drawEntropy() {
            const W = entropyCanvas.offsetWidth;
            const H = 80;
            entropyCanvas.width = W;
            entropyCanvas.height = H;
            ctx.clearRect(0, 0, W, H);

            const step = W / (ENTROPY_HISTORY - 1);
            ctx.beginPath();
            ctx.moveTo(0, H);

            entropyData.forEach((v, i) => {
                const x = i * step;
                const y = H - (v * H);
                ctx.lineTo(x, y);
            });
            ctx.lineTo(W, H);
            ctx.closePath();

            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, attackMode ? 'rgba(227, 24, 55, 0.6)' : 'rgba(0, 229, 255, 0.4)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.strokeStyle = attackMode ? '#E31837' : '#00e5ff';
            ctx.lineWidth = 2;
            ctx.stroke();

            const lastVal = entropyData[entropyData.length - 1];
            document.getElementById('stat-entropy').textContent = lastVal.toFixed(4);
            document.getElementById('stat-entropy').className = `text-xl font-bold ${attackMode ? 'text-red-500 animate-pulse' : 'text-cyan-400'}`;
        }

        setInterval(() => {
            const noise = (Math.random() - 0.5) * 0.1;
            let newVal = attackMode ? 0.8 + Math.random() * 0.15 : 0.25 + noise;
            entropyData.push(newVal);
            entropyData.shift();
            drawEntropy();

            const thr = (4.2 + Math.random() * 0.1).toFixed(2);
            document.getElementById('stat-throughput').textContent = thr + "M ev/s";
        }, 200);

        window.addEventListener('resize', drawEntropy);
        drawEntropy();
    </script>
</body>
</html>
